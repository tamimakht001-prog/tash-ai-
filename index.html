
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.A.S.H AI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#151d35">

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}
header {
  padding: 22px;
  background: #151d35;
  font-size: 24px;
  font-weight: bold;
  color: #8ab4ff;
  text-align: center;
}
#chat {
  padding: 16px;
  height: 70vh;
  overflow-y: auto;
}
.msg {
  padding: 13px 15px;
  margin: 12px 0;
  border-radius: 14px;
  max-width: 85%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}
.bot {
  background: #1d2945;
}
.user {
  background: #345bd8;
  margin-left: auto;
}
form {
  display: flex;
  gap: 8px;
  padding: 12px;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #151d35;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #44506b;
  border-radius: 12px;
  background: #0b1020;
  color: white;
  font-size: 16px;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  background: #6d8cff;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>
<header>✦ T.A.S.H AI</header>

<div id="chat">
  <div class="msg bot">
    Hello! 👋 Welcome to T.A.S.H AI.
    I'm ready to chat with you!
  </div>
</div>

<form id="form">
  <input
    id="input"
    placeholder="Ask me anything..."
    autocomplete="off"
  >
  <button type="submit">Send</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');

form.addEventListener('submit', function(e) {
  e.preventDefault();

  const text = input.value.trim();
  if (!text) return;

  function add(message, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = message;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  add(text, 'user');
  input.value = '';

  add(
    'This is the first prototype. Connect an AI backend to get real AI answers.',
    'bot'
  );
});
</script>
</body>
</html>
